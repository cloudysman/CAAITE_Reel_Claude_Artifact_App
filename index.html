<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>CAAITE reel: Claude cài artifact thành ứng dụng</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: #f9f9ff;
      }
      #main {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f9f9ff;
      }
      #main > .scene-slot {
        position: absolute;
        inset: 0;
      }
      #el-captions {
        position: absolute;
        inset: 0;
        z-index: 80;
      }
      #main > .fx-slot {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!--
      Reel dọc bản tin Claude cài artifact thành ứng dụng (1080x1920, 30 fps). TỆP SINH TỰ ĐỘNG bởi src_build/build_index.py
      từ src_build/scenes.json và voice/narration_timing.json; sửa các tệp đó rồi chạy lại.
      Cảnh: compositions/frames/*.html. Phụ đề: compositions/captions.html. Âm thanh: assets/audio/reel-mix.wav.
    -->
    <div
      id="main"
      data-composition-id="main"
      data-start="0"
      data-duration="59.372"
      data-width="1080"
      data-height="1920"

    <script>
      // Chuyển cảnh trên timeline gốc; nội dung từng cảnh nằm trong timeline riêng của cảnh đó.
      const tl = gsap.timeline({ paused: true });
      tl.to("#s01", { scale: 1.45, opacity: 0, filter: "blur(10px)", duration: 0.45, ease: "power2.in" }, 3.945);
      tl.fromTo("#s02", { scale: 1.22, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 3.995);
      tl.fromTo("#s03", { opacity: 1, clipPath: "inset(300px 40px 1005px 40px round 36px)" }, { opacity: 1, clipPath: "inset(0px 0px 0px 0px round 0px)", duration: 0.6, ease: "power3.inOut" }, 13.417);
      tl.to("#s02", { scale: 0.94, opacity: 0.55, duration: 0.6, ease: "power2.in" }, 13.417);
      tl.to("#s03", { y: -1920, duration: 0.5, ease: "power3.inOut" }, 18.53);
      tl.fromTo("#s04", { y: 1920, opacity: 1 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 18.53);
      tl.fromTo("#s05", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power2.out" }, 23.793);
      tl.to("#s05", { y: -1920, duration: 0.5, ease: "power3.inOut" }, 34.923);
      tl.fromTo("#s06", { y: 1920, opacity: 1 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 34.923);
      tl.fromTo("#s07", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power2.out" }, 41.914);
      tl.to("#s07", { opacity: 0, filter: "blur(16px)", duration: 0.8, ease: "sine.inOut" }, 52.974);
      tl.fromTo("#s08", { opacity: 0, filter: "blur(16px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.8, ease: "sine.inOut" }, 52.974);
      window.__timelines["main"] = tl;
    </script>
